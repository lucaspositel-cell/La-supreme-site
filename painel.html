<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Supreme — Painel de Pedidos</title>
<style>
:root{--bg:#120f0d;--panel:#211a17;--panel2:#2b211d;--text:#fff8ed;--muted:#c8b9ad;--gold:#dfb25b;--green:#1d8b54;--red:#b6282c;--line:#41332c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#100d0cf5;border-bottom:1px solid var(--line);padding:12px}
.head{max-width:1100px;margin:auto;display:flex;align-items:center;gap:10px}
h1{font:700 23px Georgia;margin:0}.brand{color:var(--gold)}.spacer{flex:1}
button{cursor:pointer}.arm{border:0;border-radius:10px;padding:10px 12px;background:var(--green);color:white;font-weight:900}
.wrap{max-width:1100px;margin:auto;padding:14px 12px 80px}
.statusbar{display:flex;gap:8px;overflow:auto;margin-bottom:14px}
.pill{white-space:nowrap;background:#211a17;border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:white}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px}
.card.new{border-color:var(--gold);box-shadow:0 0 0 1px #dfb25b55}.row{display:flex;gap:8px;align-items:flex-start}.order{font:700 20px Georgia}.time{color:var(--muted);font-size:12px}.grow{flex:1}.tag{font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;background:#171210}.customer{margin:12px 0 5px;font-weight:900}.muted{color:var(--muted);font-size:13px;line-height:1.45}
.items{margin-top:10px;border-top:1px dashed #4d3b32;padding-top:8px}.item{padding:7px 0;border-bottom:1px dashed #3b2e28}.item:last-child{border-bottom:0}
.total{font-size:18px;font-weight:900;margin:12px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{border:0;border-radius:10px;padding:11px;font-weight:900}.print{background:var(--gold);color:#271904}.next{background:var(--green);color:#fff}.cancel{background:var(--red);color:#fff}.done{background:#3c302a;color:#fff}.empty{text-align:center;color:var(--muted);padding:50px 10px}
.queueinfo{margin:10px 0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#171210;font-weight:900;line-height:1.45}.queueinfo .muted{font-weight:400}.queueinfo [data-queue-countdown]{font-variant-numeric:tabular-nums;font-size:1.08em}.queueinfo .queue-expired{font-weight:900}.payline{margin-top:5px;font-weight:900}.pay-paid{color:#54d98c}.pay-pending{color:#f0bd55}.notice{background:#251c18;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;color:var(--muted);font-size:13px}
@media print{
  body{background:#fff!important;color:#000!important;margin:0!important;padding:0!important}
  body>*:not(#iosPrintArea){display:none!important}
  #iosPrintArea{display:block!important;width:58mm!important;max-width:58mm!important;margin:0!important;padding:2mm!important;background:#fff!important;color:#000!important}
  #iosPrintArea pre{white-space:pre-wrap!important;word-break:break-word!important;margin:0!important;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important;font-size:10pt!important;line-height:1.18!important}
  @page{size:58mm auto;margin:0}
}
#iosPrintArea{display:none}

.dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.metric b{display:block;font-size:23px;color:var(--gold);margin-top:3px}
.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:900;letter-spacing:.5px}
.pill.active{background:var(--gold);color:#24180b;border-color:var(--gold);font-weight:900}
.card{position:relative;overflow:hidden}
.card.urgent{border-color:#e29b42;box-shadow:0 0 0 1px #e29b4244}
.card.late{border-color:#d94a4f;box-shadow:0 0 0 2px #d94a4f55}
.card.late .queueinfo{border-color:#d94a4f;background:#321719}
.card.urgent .queueinfo{border-color:#e29b42}
.cardhead{display:flex;gap:10px;align-items:flex-start}
.queuebadge{font-size:12px;font-weight:900;color:#17100b;background:var(--gold);border-radius:999px;padding:6px 9px;white-space:nowrap}
.dest{display:inline-flex;align-items:center;margin-top:7px;border:1px solid var(--line);background:#171210;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}
.item b{font-size:16px}
.obsalert{margin-top:7px;padding:8px 9px;border-radius:9px;background:#3a2514;border:1px solid #8c5e27;color:#ffd994;font-weight:900;font-size:13px}
.generalalert{margin-top:9px;padding:9px;border-radius:9px;background:#3a2514;border:1px solid #8c5e27;color:#ffd994;font-weight:900;font-size:13px}
.actions{grid-template-columns:repeat(2,minmax(0,1fr))}
.actions .primary-action{grid-column:1/-1;font-size:15px;padding:14px}
.secondary-actions{display:contents}
.queueinfo{font-size:15px}
.queueinfo [data-queue-countdown]{font-size:1.35em}
.late-label{color:#ff777b;font-weight:900}
@media(max-width:720px){
 .grid{grid-template-columns:1fr}
 .dashboard{grid-template-columns:repeat(2,1fr)}
 .head h1{font-size:19px}
 .card{padding:12px}
}

</style>
</head>
<body>
<header><div class="head"><h1>LA <span class="brand">SUPREME</span> — Pedidos</h1><div class="spacer"></div><button class="arm" onclick="armAudio()">🔔 Ativar alertas</button></div></header>
<main class="wrap">
<div class="notice" id="notice">Painel preparado. Falta inserir as chaves do banco online no código.</div>
<div class="dashboard" id="dashboard">
  <div class="metric"><span>Pedidos na fila</span><b id="mQueue">0</b></div>
  <div class="metric"><span>Pizzas na fila</span><b id="mPizzas">0</b></div>
  <div class="metric"><span>Em preparo</span><b id="mPrep">0</b></div>
  <div class="metric"><span>Maior espera</span><b id="mWait">00:00</b></div>
</div>
<div class="statusbar">
<button class="pill" data-filter="novo" onclick="setFilter('novo')">Novos</button>
<button class="pill" data-filter="preparo" onclick="setFilter('preparo')">Em preparo</button>
<button class="pill" data-filter="entrega" onclick="setFilter('entrega')">Saiu p/ entrega</button>
<button class="pill" data-filter="concluido" onclick="setFilter('concluido')">Concluídos</button>
<button class="pill" data-filter="todos" onclick="setFilter('todos')">Todos</button>
</div>
<div id="orders" class="grid"></div>
</main>
<div id="iosPrintArea" aria-hidden="true"><pre id="iosPrintText"></pre></div>
<script>
const SUPABASE_URL='https://stacwvpsfjvyvbjwagtd.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_uM7vsWn839Zmj1lTk3yKyg_b5Vj501Z';
let filter='novo', lastSeen=new Set(), audioArmed=false, firstLoad=true;

const money=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function configured(){return SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('COLE_AQUI')&&!SUPABASE_ANON_KEY.includes('COLE_AQUI')}
function setFilter(v){
  filter=v;
  document.querySelectorAll('.pill[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===v));
  loadOrders();
}
function armAudio(){audioArmed=true;beep();document.querySelector('.arm').textContent='🔔 Alertas ativos';}
function beep(){if(!audioArmed)return;try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.value=.12;o.start();setTimeout(()=>{o.stop();a.close()},250)}catch(e){}}

async function api(path,opts={}){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{
    ...opts,
    headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json',Prefer:'return=representation',...(opts.headers||{})}
  });
  if(!r.ok)throw new Error(await r.text());
  const t=await r.text();return t?JSON.parse(t):null;
}
function isPizzaItem(x){
  const name=String(x?.name ?? x?.produto_nome ?? x?.sabor ?? '').toLowerCase();
  const cat=String(x?.category ?? x?.categoria ?? '').toLowerCase();
  const size=String(x?.size ?? x?.tamanho ?? '').toLowerCase();
  const excluded=/(calzone|crostini|crostine|pizza roll|roll|bebida|refrigerante|coca|fanta|sprite|guaran|vinho|cerveja|suco|água|agua)/i;
  if(excluded.test(name)||excluded.test(cat)) return false;
  if(cat.includes('pizza')) return true;
  return ['broto','grande'].some(v=>size.includes(v));
}
function pizzaCount(o){
  const items=Array.isArray(o.items)?o.items:[];
  return items.reduce((n,x)=>n+(isPizzaItem(x)?Math.max(1,Number(x.qty ?? x.quantidade ?? 1)||1):0),0);
}
function needsTransport15(o){
  if(String(o.fulfillment||'').toLowerCase()!=='delivery') return false;
  const a=String(o.address||'').toLowerCase();
  return a.includes('pereiras') || a.includes('laranjal paulista') || a.includes('laranjal');
}

function orderDestination(o){
  if(String(o.fulfillment||'').toLowerCase()!=='delivery') return 'RETIRADA';
  const a=String(o.address||'').toLowerCase();
  if(a.includes('pereiras')) return 'PEREIRAS';
  if(a.includes('laranjal')) return 'LARANJAL';
  if(a.includes('maristela')) return 'MARISTELA';
  return 'DELIVERY';
}
function updateDashboard(rows){
  const active=(rows||[]).filter(o=>['novo','preparo'].includes(String(o.status||'').toLowerCase()));
  const pizzas=active.reduce((n,o)=>n+pizzaCount(o),0);
  const prep=active.filter(o=>String(o.status||'').toLowerCase()==='preparo').length;
  let maxLeft=0;
  queueMeta.forEach((q,id)=>{
    const target=queueCountdownTargets.get(String(id));
    if(target) maxLeft=Math.max(maxLeft,target-Date.now());
  });
  const q=document.getElementById('mQueue'),p=document.getElementById('mPizzas'),pr=document.getElementById('mPrep'),w=document.getElementById('mWait');
  if(q)q.textContent=active.length;
  if(p)p.textContent=pizzas;
  if(pr)pr.textContent=prep;
  if(w)w.textContent=maxLeft>0?queueCountdownText(maxLeft):'00:00';
}
function buildQueueMeta(rows){
  const active=rows.filter(o=>['novo','preparo'].includes(String(o.status||'').toLowerCase()))
    .sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  let kitchenMinutes=0;
  const meta=new Map();
  active.forEach((o,i)=>{
    const pizzas=pizzaCount(o);
    const production=Math.max(0,pizzas*10);
    kitchenMinutes+=production;
    const transport=needsTransport15(o)?15:0;
    meta.set(String(o.id),{position:i+1,pizzas,production,transport,eta:kitchenMinutes+transport});
  });
  return meta;
}
let queueMeta=new Map();
let latestProductionRows=[];
const queueCountdownTargets=new Map();

function queueCountdownText(ms){
  const total=Math.max(0,Math.ceil(ms/1000));
  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const sec=total%60;
  return h>0
    ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function syncQueueCountdownTargets(meta){
  const now=Date.now();
  const activeIds=new Set();

  meta.forEach((q,id)=>{
    const key=String(id);
    activeIds.add(key);
    const proposed=now+(Math.max(0,Number(q.eta)||0)*60000);
    const current=queueCountdownTargets.get(key);

    // Mantém a contagem andando entre as atualizações do painel.
    // Se a fila andar mais rápido, encurta a previsão; não reinicia o relógio a cada refresh.
    if(!current || proposed<current){
      queueCountdownTargets.set(key,proposed);
    }
    q.targetAt=queueCountdownTargets.get(key);
  });

  [...queueCountdownTargets.keys()].forEach(id=>{
    if(!activeIds.has(id)) queueCountdownTargets.delete(id);
  });
}

function updateQueueCountdowns(){
  const now=Date.now();
  document.querySelectorAll('[data-queue-countdown]').forEach(el=>{
    const id=String(el.getAttribute('data-queue-countdown')||'');
    const target=queueCountdownTargets.get(id);
    if(!target) return;
    const left=target-now;
    const card=el.closest('.card');
    if(left>0){
      el.textContent=queueCountdownText(left);
      el.classList.remove('queue-expired','late-label');
      if(card){
        card.classList.toggle('urgent',left<=5*60000);
        card.classList.remove('late');
      }
    }else{
      el.textContent='ATRASADO +'+queueCountdownText(Math.abs(left));
      el.classList.add('queue-expired','late-label');
      if(card){card.classList.add('late');card.classList.remove('urgent');}
    }
  });
  updateDashboard(latestProductionRows);
}
setInterval(updateQueueCountdowns,1000);
async function loadOrders(){
  if(!configured()){
    document.getElementById('notice').textContent='Falta configurar SUPABASE_URL e SUPABASE_ANON_KEY.';
    document.getElementById('orders').innerHTML='<div class="empty">Banco online ainda não conectado.</div>';
    return;
  }
  document.getElementById('notice').textContent='🟢 Online — verificando novos pedidos automaticamente.';
  let q='orders?select=*&order=created_at.desc&limit=60';
  try{
    let allRows=await api(q);

    // Pix ainda não confirmado não entra na fila de produção.
    const productionRows=allRows.filter(o=>{
      const method=String(o.payment||'').trim().toLowerCase();
      const st=String(o.payment_status||'').trim().toLowerCase();
      return !(String(o.status||'').toLowerCase()==='novo' && method==='pix' && !['approved','paid','processed','accredited'].includes(st));
    });
    latestProductionRows=productionRows;
    queueMeta=buildQueueMeta(productionRows);
    syncQueueCountdownTargets(queueMeta);
    updateDashboard(productionRows);

    let rows=filter==='todos' ? allRows : allRows.filter(o=>String(o.status||'').toLowerCase()===filter);
    if(filter==='novo') rows=productionRows.filter(o=>String(o.status||'').toLowerCase()==='novo');

    if(!firstLoad && filter==='novo'){
      rows.forEach(o=>{if(!lastSeen.has(o.id)){beep();}});
    }
    rows.forEach(o=>lastSeen.add(o.id)); firstLoad=false;
    render(rows);
    updateQueueCountdowns();
  }catch(e){
    document.getElementById('notice').textContent='Erro ao carregar pedidos: '+e.message;
  }
}
function render(rows){
  const el=document.getElementById('orders');
  if(!rows.length){el.innerHTML='<div class="empty">Nenhum pedido nesta etapa.</div>';return}
  const ordered=[...rows].sort((a,b)=>{
    const qa=queueMeta.get(String(a.id)), qb=queueMeta.get(String(b.id));
    if(qa&&qb)return qa.position-qb.position;
    if(qa)return -1;if(qb)return 1;
    return new Date(b.created_at)-new Date(a.created_at);
  });
  el.innerHTML=ordered.map(o=>{
    const items=Array.isArray(o.items)?o.items:[];
    const q=queueMeta.get(String(o.id));
    const dest=orderDestination(o);
    return `<article class="card ${o.status==='novo'?'new':''}">
      <div class="cardhead">
        <div>
          <div class="order">${esc(o.order_no)}</div>
          <div class="time">${new Date(o.created_at).toLocaleString('pt-BR')}</div>
          <span class="dest">${o.fulfillment==='delivery'?'🛵':'🏪'} ${dest}</span>
        </div>
        <div class="grow"></div>
        ${q?`<span class="queuebadge">FILA #${String(q.position).padStart(2,'0')}</span>`:''}
        <span class="tag">${esc(statusLabel(o.status))}</span>
      </div>
      ${q?`<div class="queueinfo">⏱️ COZINHA: <span data-queue-countdown="${esc(o.id)}">${queueCountdownText((q.targetAt||Date.now())-Date.now())}</span><div class="muted">${q.pizzas} pizza${q.pizzas===1?'':'s'} × 10 min${q.transport?' • entrega +15 min':''}</div></div>`:''}
      <div class="customer">${esc(o.customer_name)}</div>
      <div class="muted">${o.customer_phone?esc(o.customer_phone)+'<br>':''}${o.fulfillment==='delivery'?'🛵 '+esc(o.address):'🏪 Retirada'}<br>${paymentLine(o)}</div>
      <div class="items">${items.map(x=>`<div class="item"><b>${x.qty||1}× ${esc(x.name)}</b>${x.size?'<br><span class="muted">'+esc(x.size)+'</span>':''}${x.crust?'<br><span class="muted">Borda: '+esc(x.crust)+'</span>':''}${x.obs?'<div class="obsalert">⚠️ '+esc(x.obs)+'</div>':''}</div>`).join('')}</div>
      ${o.general_obs?`<div class="generalalert">⚠️ OBS. GERAL: ${esc(o.general_obs)}</div>`:''}
      ${Number(o.discount||0)>0?`<div class="muted" style="margin-top:10px">Subtotal: ${money(o.subtotal)}<br>Desconto${o.coupon_code?` (${esc(o.coupon_code)})`:''}: − ${money(o.discount)}${Number(o.delivery_fee||0)>0?`<br>Taxa de entrega: ${money(o.delivery_fee)}`:''}</div>`:''}
      <div class="total">Total: ${money(o.total!=null ? o.total : Number(o.subtotal||0)+Number(o.delivery_fee||0)-Number(o.discount||0))}</div>
      <div class="actions">
        ${nextButton(o)}
        <div class="secondary-actions">
          <button class="print" onclick='printOrder(${JSON.stringify(o).replace(/'/g,"&#39;")})'>🖨️ Cozinha</button>
          ${o.fulfillment==='delivery'?`<button class="print" onclick='printDelivery(${JSON.stringify(o).replace(/'/g,"&#39;")})'>🛵 Delivery</button>`:''}
          ${cancelButton(o)}
        </div>
      </div>
    </article>`;
  }).join('');
}
function statusLabel(status){
  return ({novo:'NOVO',preparo:'EM PREPARO',entrega:'EM ENTREGA',concluido:'CONCLUÍDO',cancelado:'CANCELADO'})[String(status||'').toLowerCase()]||String(status||'').toUpperCase();
}
function paymentLine(o){
  const method=String(o.payment||'').trim();
  if(method.toLowerCase()!=='pix') return `Pagamento: ${esc(method)}`;
  const st=String(o.payment_status||'').toLowerCase();
  const paid=['approved','paid','processed','accredited'].includes(st);
  return paid
    ? `<span class="payline pay-paid">Pagamento: Pix — ✅ PAGO</span>`
    : `<span class="payline pay-pending">Pagamento: Pix — ⏳ AGUARDANDO PAGAMENTO</span>`;
}
function nextButton(o){
  if(o.status==='novo')return `<button class="next primary-action" onclick="statusOrder('${o.id}','preparo')">🔥 INICIAR PREPARO</button>`;
  if(o.status==='preparo')return `<button class="next primary-action" onclick="statusOrder('${o.id}','entrega')">${o.fulfillment==='delivery'?'🛵 PRONTO / SAIU PARA ENTREGA':'🏪 PRONTO PARA RETIRADA'}</button>`;
  if(o.status==='entrega')return `<button class="next primary-action" onclick="statusOrder('${o.id}','concluido')">✓ CONCLUIR PEDIDO</button>`;
  return `<button class="done primary-action" disabled>✓ CONCLUÍDO</button>`;
}
function cancelButton(o){
  if(['concluido','cancelado'].includes(String(o.status||'').toLowerCase())) return '';
  return `<button class="cancel" onclick="cancelOrder('${o.id}','${String(o.order_no||'').replace(/'/g,"\'")}')">✕ Cancelar pedido</button>`;
}
async function cancelOrder(id,orderNo){
  const ok=confirm(`Cancelar o pedido ${orderNo || ''}?\n\nEsta ação retirará o pedido da fila de produção e manterá o registro como CANCELADO.`);
  if(!ok)return;
  try{
    await api(`orders?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({status:'cancelado'})});
    await loadOrders();
    alert('Pedido cancelado com sucesso.');
  }catch(e){
    alert('Não foi possível cancelar o pedido: '+e.message);
  }
}
async function statusOrder(id,status){
  const payload={status};
  if(status==='concluido')payload.concluded_at=new Date().toISOString();
  await api(`orders?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify(payload)});
  loadOrders();
}
function receipt(o){
  const W=32,L='-'.repeat(W),D='='.repeat(W),c=s=>' '.repeat(Math.max(0,Math.floor((W-String(s).length)/2)))+s;
  const wrap=(s,w=30)=>{let a=[],cur='';String(s||'').split(/\s+/).forEach(x=>{if((cur+' '+x).trim().length>w){if(cur)a.push(cur);cur=x}else cur=(cur+' '+x).trim()});if(cur)a.push(cur);return a};
  let r=[
    D,
    c('LA SUPREME'),
    c('COMANDA DA COZINHA'),
    D,
    `PEDIDO: ${o.order_no}`,
    `HORARIO: ${new Date(o.created_at).toLocaleString('pt-BR')}`,
    `TIPO: ${o.fulfillment==='delivery'?'DELIVERY':'RETIRADA'}`,
    `CLIENTE: ${o.customer_name||''}`,
    L
  ];
  (o.items||[]).forEach(x=>{
    wrap(`${x.qty||1}x ${x.name}`).forEach(v=>r.push(v.toUpperCase()));
    if(x.size)r.push('  TAMANHO: '+String(x.size).toUpperCase());
    if(x.crust)r.push('  BORDA: '+String(x.crust).toUpperCase());
    if(x.obs)wrap('  OBS: '+x.obs).forEach(v=>r.push(v.toUpperCase()));
    r.push('');
  });
  if(o.general_obs){
    r.push(L,'OBS. GERAIS:');
    wrap(o.general_obs).forEach(v=>r.push(v.toUpperCase()));
  }
  r.push(L,c('FIM DA COMANDA'),D,'','','');
  return r.join('\n');
}

function deliveryReceipt(o){
  const W=32,L='-'.repeat(W),D='='.repeat(W),c=s=>' '.repeat(Math.max(0,Math.floor((W-String(s).length)/2)))+s;
  const wrap=(s,w=30)=>{let a=[],cur='';String(s||'').split(/\s+/).forEach(x=>{if((cur+' '+x).trim().length>w){if(cur)a.push(cur);cur=x}else cur=(cur+' '+x).trim()});if(cur)a.push(cur);return a};
  const brl=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
  const items=Array.isArray(o.items)?o.items:[];
  const subtotal=Number(o.subtotal||0);
  const fee=Number(o.delivery_fee||0);
  const total=Number(o.total!=null ? o.total : subtotal+fee);

  let r=[
    D,
    c('LA SUPREME'),
    c('CUPOM DELIVERY / MOTOBOY'),
    D,
    `PEDIDO: ${o.order_no}`,
    `HORARIO: ${new Date(o.created_at).toLocaleString('pt-BR')}`,
    L,
    'CLIENTE:'
  ];

  wrap(o.customer_name||'').forEach(v=>r.push(v.toUpperCase()));
  if(o.customer_phone) r.push(`FONE: ${o.customer_phone}`);

  r.push(L,'ITENS / SABORES:');

  if(!items.length){
    r.push('SEM ITENS REGISTRADOS');
  }else{
    items.forEach(x=>{
      const qtd=Number(x.qty ?? x.quantidade ?? 1);
      const nome=String(x.name ?? x.produto_nome ?? x.sabor ?? 'Produto');

      let unit=Number(
        x.unit ??
        x.preco_unitario ??
        x.price ??
        0
      );

      if(!unit && x.total!=null){
        unit=Number(x.total)/Math.max(qtd,1);
      }

      const itemTotal=Number(
        x.total!=null ? x.total : unit*qtd
      );

      wrap(`${qtd}x ${nome}`).forEach(v=>r.push(v.toUpperCase()));

      if(x.size || x.tamanho)
        r.push(`  TAMANHO: ${String(x.size||x.tamanho).toUpperCase()}`);

      if(x.crust || x.borda)
        r.push(`  BORDA: ${String(x.crust||x.borda).toUpperCase()}`);

      if(x.sabor_1 && x.sabor_2){
        wrap(`  SABORES: 1/2 ${x.sabor_1} + 1/2 ${x.sabor_2}`)
          .forEach(v=>r.push(v.toUpperCase()));
      }

      if(x.obs || x.observacoes){
        wrap(`  OBS: ${x.obs||x.observacoes}`)
          .forEach(v=>r.push(v.toUpperCase()));
      }

      r.push(`  VALOR: ${brl(itemTotal)}`);
      r.push('');
    });
  }

  r.push(L);
  r.push(`SUBTOTAL: ${brl(subtotal)}`);
  const discount=Number(o.discount||0);
  if(discount>0) r.push(`DESCONTO${o.coupon_code?` (${String(o.coupon_code).toUpperCase()})`:''}: - ${brl(discount)}`);
  if(fee>0) r.push(`TAXA ENTREGA: ${brl(fee)}`);
  r.push(`TOTAL: ${brl(total)}`);

  r.push(L,'ENDERECO DE ENTREGA:');
  wrap(o.address||'ENDERECO NAO INFORMADO').forEach(v=>r.push(v.toUpperCase()));

  r.push(L,`PAGAMENTO: ${String(o.payment||'').toUpperCase()}`);

  if(o.general_obs){
    r.push(L,'OBSERVACOES:');
    wrap(o.general_obs).forEach(v=>r.push(v.toUpperCase()));
  }

  r.push(D,c('ENTREGA LA SUPREME'),D,'','','');
  return r.join('\n');
}
function printDelivery(o){
  if(o.fulfillment!=='delivery'){alert('Este pedido é para retirada.');return;}
  const txt=deliveryReceipt(o);
  if(isAndroid()){
    window.location.href='rawbt:'+encodeURIComponent(txt);
    return;
  }
  document.getElementById('iosPrintText').textContent=txt;
  setTimeout(()=>window.print(),120);
}

function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function isAndroid(){return /Android/i.test(navigator.userAgent);}
function markPrinted(o){
  api(`orders?id=eq.${encodeURIComponent(o.id)}`,{method:'PATCH',body:JSON.stringify({printed:true})}).catch(()=>{});
}
function printOrder(o){
  const key='ls_printed_'+o.id;
  if(localStorage.getItem(key)){
    if(!confirm('Este pedido já foi enviado à impressão neste aparelho. Imprimir novamente?'))return;
  }
  const txt=receipt(o);

  // Android: mantém exatamente o fluxo atual pela RawBT.
  if(isAndroid()){
    localStorage.setItem(key,String(Date.now()));
    window.location.href='rawbt:'+encodeURIComponent(txt);
    markPrinted(o);
    return;
  }

  // iPhone/iPad e demais navegadores: usa a impressão do sistema.
  // No iOS, a impressora precisa aparecer no seletor de impressão (AirPrint/app compatível).
  document.getElementById('iosPrintText').textContent=txt;
  localStorage.setItem(key,String(Date.now()));
  setTimeout(()=>{
    window.print();
    markPrinted(o);
  },120);
}
