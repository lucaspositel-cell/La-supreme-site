async function api(p,o={}){
  let r=await fetch(`${SUPABASE_URL}/rest/v1/${p}`,{...o,headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json',Prefer:'return=representation',...(o.headers||{})}});

}

async function load(){

  }catch(e){notice.textContent='Erro ao conectar: '+e.message}

  tables.innerHTML=tabs.map(t=>`<div class="mesa ${t.status}" onclick="openT('${t.id}')"><b>Mesa ${esc(t.numero)}</b><div class="small">${String(t.status).toUpperCase()}</div><div class="small">${t.status==='livre'?'Disponível':'Comanda aberta'}</div></div>`).join('');

async function openT(id){
  curT=tabs.find(t=>String(t.id)===String(id));
  if(curT.status==='livre'){
    modal.innerHTML=`<div class="modalbg"><div class="modal"><div class="row"><h2>Mesa ${esc(curT.numero)}</h2><span class="grow"></span><button class="dark" onclick="closeM()">Fechar</button></div><div class="field"><input id="cust" placeholder="Cliente (opcional)"></div><div class="actions"><button class="dark" onclick="closeM()">Cancelar</button><button class="ok" onclick="startT()">Abrir mesa</button></div></div></div>`;
    return;
  }
  let a=await api(`comandas?mesa_id=eq.${curT.id}&status=eq.aberta&select=*&order=aberta_em.desc&limit=1`);
  if(!a.length){await api(`mesas?id=eq.${curT.id}`,{method:'PATCH',body:JSON.stringify({status:'livre'})});await load();return openT(id)}

async function addP(p,size,price,w){
  if(w==='b'){
    bCart.push({produto_nome:p.name,tamanho:size,sabor_1:p.name,sabor_2:null,quantidade:1,preco_unitario:price,adicionais:0,total:price,observacoes:p.category});

  }

function pizzaProducts(){return PRODUCTS.filter(p=>p.broto!=null && !['Bebidas','Calzones','Crostinis','Pizza Rolls'].includes(p.category))}

function openHalfHalf(where){

}

async function addHalfHalf(where){
  const ps=pizzaProducts(),p1=ps[Number(hh1.value)],p2=ps[Number(hh2.value)],size=hhsize.value;
  const k=size==='Broto'?'broto':'grande';
  const price=(Number(p1[k])+Number(p2[k]))/2;
  const obj={produto_nome:`½ ${p1.name} + ½ ${p2.name}`,tamanho:size,sabor_1:p1.name,sabor_2:p2.name,quantidade:1,preco_unitario:price,adicionais:0,total:price,observacoes:'Pizza meio a meio 50/50'};
  if(where==='b'){bCart.push(obj);closeM();renderBCart();return}
  let a=await api('comanda_itens',{method:'POST',body:JSON.stringify({comanda_id:curC.id,...obj})});
  sitems.push(a[0]);await recalc();showT();
}

async function recalc(){
  let s=sitems.reduce((a,x)=>a+Number(x.total),0);
  await api(`comandas?id=eq.${curC.id}`,{method:'PATCH',body:JSON.stringify({subtotal:s,total:s})});
}

function renderTItems(){
  titems.innerHTML=sitems.map(x=>`<div class="item"><div class="row"><div class="grow"><b>${x.quantidade}x ${esc(x.produto_nome)}</b><div class="small">${esc(x.tamanho||'')} — ${money(x.total)}</div></div><button class="red" onclick="delI('${x.id}')">×</button></div></div>`).join('');
  ttot.textContent=money(sitems.reduce((a,x)=>a+Number(x.total),0));
}

async function delI(id){
  await api(`comanda_itens?id=eq.${id}`,{method:'DELETE'});
  sitems=sitems.filter(x=>String(x.id)!==String(id)); await recalc(); renderTItems();
}

function closeTUI(){
  let total=sitems.reduce((a,x)=>a+Number(x.total),0);
  modal.innerHTML=`<div class="modalbg"><div class="modal"><h2>Fechar Mesa ${esc(curT.numero)}</h2><div class="total">Total: ${money(total)}</div><div class="field"><select id="tpay"><option>Pix</option><option>Dinheiro</option><option>Cartão Débito</option><option>Cartão Crédito</option></select></div><div class="field"><input id="disc" value="0" inputmode="decimal" placeholder="Desconto"></div><div class="actions"><button class="dark" onclick="showT()">Voltar</button><button class="ok" onclick="finishT()">Confirmar</button></div></div></div>`;
}

async function finishT(){
  let sub=sitems.reduce((a,x)=>a+Number(x.total),0),d=Number(String(disc.value).replace(',','.'))||0,total=Math.max(0,sub-d);
  await api(`comandas?id=eq.${curC.id}`,{method:'PATCH',body:JSON.stringify({status:'fechada',fechada_em:new Date().toISOString(),subtotal:sub,desconto:d,total,forma_pagamento:tpay.value})});
  await api(`mesas?id=eq.${curT.id}`,{method:'PATCH',body:JSON.stringify({status:'livre'})});
  closeM(); await load(); alert('Mesa fechada. Total: '+money(total));
}

function renderBCart(){
  bitems.innerHTML=bCart.map((x,i)=>`<div class="item"><div class="row"><div class="grow"><b>${x.quantidade}x ${esc(x.produto_nome)}</b><div class="small">${esc(x.tamanho||'')} — ${money(x.total)}</div></div><button class="red" onclick="bCart.splice(${i},1);renderBCart()">×</button></div></div>`).join('');
  btot.textContent=money(bCart.reduce((a,x)=>a+Number(x.total),0));
}

async function finishB(){
  if(!bCart.length)return alert('Adicione itens.');
  let total=bCart.reduce((a,x)=>a+Number(x.total),0);
  let a=await api('comandas',{method:'POST',body:JSON.stringify({tipo:'balcao',mesa_id:null,cliente_nome:bc.value.trim()||null,status:'fechada',subtotal:total,desconto:0,acrescimo:0,total,forma_pagamento:bpay.value,fechada_em:new Date().toISOString()})});
  const c=a[0];
  await api('comanda_itens',{method:'POST',body:JSON.stringify(bCart.map(x=>({comanda_id:c.id,...x})))});
  alert('Venda de balcão finalizada. Total: '+money(total));
  bCart=[];renderBCart();bc.value='';
}


async function loadCaixa(){
  cashbox.innerHTML='<h2>Caixa</h2><div class="small">Carregando...</div>';
  try{
    const a=await api('caixa_sessoes?status=eq.aberto&select=*&order=aberto_em.desc&limit=1');
    if(!a.length){
      cashbox.innerHTML=`<h2>Caixa fechado</h2><div class="notice">Abra o caixa para iniciar o movimento do turno.</div><div class="field"><input id="cop" placeholder="Operador"></div><div class="field"><input id="cab" inputmode="decimal" value="0" placeholder="Valor inicial em dinheiro"></div><button class="ok" style="width:100%;margin-top:10px" onclick="abrirCaixa()">Abrir caixa</button>`;
      return;
    }
    const c=a[0], inicio=encodeURIComponent(c.aberto_em);
    const vendasInternas=await api(`comandas?status=eq.fechada&fechada_em=gte.${inicio}&select=total,forma_pagamento,fechada_em,tipo`);
    const vendasDelivery=await api(`orders?status=eq.concluido&concluded_at=gte.${inicio}&select=total,payment,concluded_at`);
    const vendas=[
      ...vendasInternas.map(v=>({total:v.total,forma_pagamento:v.forma_pagamento,origem:v.tipo||'interno'})),
      ...vendasDelivery.map(v=>({total:v.total,forma_pagamento:v.payment,origem:'delivery'}))
    ];
    const movs=await api(`caixa_movimentos?caixa_id=eq.${c.id}&select=*&order=criado_em.desc`);
    const soma=pg=>vendas.filter(v=>v.forma_pagamento===pg).reduce((n,v)=>n+Number(v.total||0),0);
    const pix=soma('Pix'), din=soma('Dinheiro'), deb=soma('Cartão Débito'), cred=soma('Cartão Crédito');
    const vendasTotal=vendas.reduce((n,v)=>n+Number(v.total||0),0);
    const deliveryTotal=vendas.filter(v=>v.origem==='delivery').reduce((n,v)=>n+Number(v.total||0),0);
    const internoTotal=vendasTotal-deliveryTotal;
    const supr=movs.filter(m=>m.tipo==='suprimento').reduce((n,m)=>n+Number(m.valor||0),0);
    const sang=movs.filter(m=>m.tipo==='sangria').reduce((n,m)=>n+Number(m.valor||0),0);
    const esperado=Number(c.valor_abertura||0)+din+supr-sang;
    cashbox.innerHTML=`<div class="row"><h2>Caixa aberto</h2><span class="grow"></span><b class="gold">${esc(c.operador||'Operador')}</b></div>
      <div class="small">Aberto em ${new Date(c.aberto_em).toLocaleString('pt-BR')}</div>
      <div class="total">Vendas do turno: ${money(vendasTotal)}</div>
      <div class="card" style="margin-top:10px"><div class="row"><span class="grow">Mesas + Balcão</span><b>${money(internoTotal)}</b></div><div class="row"><span class="grow">Delivery</span><b>${money(deliveryTotal)}</b></div></div>
      <div class="card" style="margin-top:10px"><div class="row"><span class="grow">Dinheiro</span><b>${money(din)}</b></div><div class="row"><span class="grow">Pix</span><b>${money(pix)}</b></div><div class="row"><span class="grow">Débito</span><b>${money(deb)}</b></div><div class="row"><span class="grow">Crédito</span><b>${money(cred)}</b></div></div>
      <div class="card" style="margin-top:10px"><div class="row"><span class="grow">Abertura</span><b>${money(c.valor_abertura)}</b></div><div class="row"><span class="grow">Suprimentos</span><b>${money(supr)}</b></div><div class="row"><span class="grow">Sangrias</span><b>-${money(sang)}</b></div><div class="row"><span class="grow"><b>Dinheiro esperado</b></span><b>${money(esperado)}</b></div></div>
      <div class="actions" style="margin-top:10px"><button class="yellow" onclick="movCaixa('suprimento',${c.id})">+ Suprimento</button><button class="red" onclick="movCaixa('sangria',${c.id})">− Sangria</button></div>
      <button class="ok" style="width:100%;margin-top:10px" onclick="fecharCaixa(${c.id},${esperado})">Fechar caixa</button>`;
  }catch(e){cashbox.innerHTML='<h2>Caixa</h2><div class="notice">Erro: '+esc(e.message)+'</div>'}
}

async function abrirCaixa(){
  const v=Number(String(cab.value).replace(',','.'))||0;
  try{await api('caixa_sessoes',{method:'POST',body:JSON.stringify({operador:cop.value.trim()||'Operador',valor_abertura:v,status:'aberto'})});await loadCaixa()}catch(e){alert('Erro ao abrir caixa: '+e.message)}
}

async function movCaixa(tipo,id){
  const nome=tipo==='sangria'?'Sangria':'Suprimento';
  const v=prompt(nome+' — valor em R$'); if(v===null)return;
  const valor=Number(String(v).replace(',','.')); if(!(valor>0))return alert('Informe um valor válido.');
  const descricao=prompt('Descrição (opcional)')||null;
  try{await api('caixa_movimentos',{method:'POST',body:JSON.stringify({caixa_id:id,tipo,valor,descricao})});await loadCaixa()}catch(e){alert('Erro: '+e.message)}
}

async function fecharCaixa(id,esperado){
  const v=prompt('Dinheiro contado no caixa (R$)',Number(esperado).toFixed(2).replace('.',',')); if(v===null)return;
  const informado=Number(String(v).replace(',','.')); if(!Number.isFinite(informado)||informado<0)return alert('Informe um valor válido.');
  const dif=informado-Number(esperado);
  if(!confirm('Esperado: '+money(esperado)+'\nInformado: '+money(informado)+'\nDiferença: '+money(dif)+'\n\nConfirmar fechamento?'))return;
  try{await api(`caixa_sessoes?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:'fechado',valor_fechamento_informado:informado,valor_fechamento_esperado:esperado,diferenca:dif,fechado_em:new Date().toISOString()})});alert('Caixa fechado. Diferença: '+money(dif));await loadCaixa()}catch(e){alert('Erro ao fechar caixa: '+e.message)}
}

function localDateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function reportRange(preset=reportPreset){
  const now=new Date(), end=new Date(now); end.setHours(23,59,59,999);
  let start=new Date(now); start.setHours(0,0,0,0);
  if(preset==='ontem'){start.setDate(start.getDate()-1);end.setDate(end.getDate()-1)}
  if(preset==='7dias')start.setDate(start.getDate()-6);
  if(preset==='30dias')start.setDate(start.getDate()-29);
  if(preset==='personalizado'){
    if(!reportIni||!reportFim)return null;
    start=new Date(reportIni+'T00:00:00');end=new Date(reportFim+'T23:59:59.999');
  }
  return {start,end};
}
function reportFilterBar(){
  const btn=(id,label)=>`<button class="${reportPreset===id?'yellow':'dark'}" onclick="setReportPreset('${id}')">${label}</button>`;
  return `<div class="card" style="margin-top:10px"><div class="small">Período do relatório</div><div class="report-filters">${btn('hoje','Hoje')}${btn('ontem','Ontem')}${btn('7dias','7 dias')}${btn('30dias','30 dias')}${btn('personalizado','Personalizado')}</div>${reportPreset==='personalizado'?`<div class="actions field"><input id="rini" type="date" value="${esc(reportIni)}"><input id="rfim" type="date" value="${esc(reportFim)}"></div><button class="ok" style="width:100%;margin-top:8px" onclick="applyCustomReport()">Aplicar período</button>`:''}</div>`;
}
function setReportPreset(p){
  reportPreset=p;
  if(p==='personalizado'){
    const now=new Date(); if(!reportFim)reportFim=localDateStr(now); if(!reportIni)reportIni=reportFim;
    reports.innerHTML='<h2>Relatórios</h2>'+reportFilterBar()+'<div class="small" style="margin-top:10px">Escolha as datas e toque em Aplicar período.</div>';
    return;
  }
  loadRelatorios();
}
function applyCustomReport(){
  reportIni=document.getElementById('rini').value;reportFim=document.getElementById('rfim').value;
  if(!reportIni||!reportFim)return alert('Informe a data inicial e final.');
  if(reportIni>reportFim)return alert('A data inicial não pode ser maior que a final.');
  loadRelatorios();
}

function vendaDetalheHtml(v,itensVenda){
  const origemNome=k=>String(k||'outro').replace('balcao','Balcão').replace('mesa','Mesa').replace('delivery','Delivery');
  const lista=itensVenda.length?itensVenda.map(x=>`<div class="item"><b>${Number(x.quantidade||1)}x ${esc(x.produto_nome||'Produto')}</b><div class="small">${esc(x.tamanho||'')}${x.sabor_2?' · ½ '+esc(x.sabor_1)+' + ½ '+esc(x.sabor_2):''} · ${money(x.total)}</div></div>`).join(''):'<div class="small">Sem itens registrados.</div>';
  modal.innerHTML=`<div class="modalbg"><div class="modal"><div class="row"><h2>Detalhes da venda</h2><span class="grow"></span><button class="dark" onclick="closeM()">Fechar</button></div>
    <div class="card">
      ${reportRow('Data',new Date(v.fechada_em).toLocaleString('pt-BR'))}
      ${reportRow('Origem',origemNome(v.tipo))}
      ${v.cliente_nome?reportRow('Cliente',esc(v.cliente_nome)):''}
      ${reportRow('Pagamento',esc(v.forma_pagamento||'Não informado'))}
      ${reportRow('Subtotal',money(v.subtotal))}
      ${reportRow('Desconto',money(v.desconto))}
      ${reportRow('Total',money(v.total))}
    </div>
    <h3>Itens da venda</h3>${lista}
    <button class="ok" style="width:100%;margin-top:12px" onclick="closeM()">Fechar</button>
  </div></div>`;
}

async function loadRelatorios(){
  reports.innerHTML='<h2>Relatórios</h2>'+reportFilterBar()+'<div class="small" style="margin-top:10px">Carregando...</div>';
  try{
    const rg=reportRange();
    if(!rg)return;
    const ini=encodeURIComponent(rg.start.toISOString()), fim=encodeURIComponent(rg.end.toISOString());
    const vendasInternas=await api(`comandas?status=eq.fechada&fechada_em=gte.${ini}&fechada_em=lte.${fim}&select=id,tipo,cliente_nome,total,subtotal,desconto,forma_pagamento,fechada_em`);
    const ids=vendasInternas.map(v=>v.id);
    let itens=[];
    if(ids.length)itens=await api(`comanda_itens?comanda_id=in.(${ids.join(',')})&select=comanda_id,produto_nome,tamanho,sabor_1,sabor_2,quantidade,total`);

    // Delivery: só entra no faturamento quando o pedido estiver concluído.
    const pedidosDelivery=await api(`orders?status=eq.concluido&concluded_at=gte.${ini}&concluded_at=lte.${fim}&select=id,order_no,created_at,concluded_at,customer_name,payment,subtotal,delivery_fee,total,items`);
    const vendasDelivery=pedidosDelivery.map(o=>({
      id:'delivery_'+o.id,
      tipo:'delivery',
      cliente_nome:o.customer_name||null,
      total:Number(o.total||0),
      subtotal:Number(o.subtotal||0),
      desconto:0,
      forma_pagamento:o.payment||'Não informado',
      fechada_em:o.concluded_at||o.created_at,
      _order_no:o.order_no,
      _delivery:true
    }));
    pedidosDelivery.forEach(o=>{
      (Array.isArray(o.items)?o.items:[]).forEach((x,idx)=>{
        const nome=x.name||'Produto';
        const qtd=Number(x.qty||1);
        const unit=Number(x.unit||0);
        // Para meio a meio, tenta aproveitar os sabores se vierem estruturados;
        // caso contrário mantém o nome completo do item.
        itens.push({
          comanda_id:'delivery_'+o.id,
          produto_nome:nome,
          tamanho:x.size||'',
          sabor_1:x.flavor1||x.sabor_1||'',
          sabor_2:x.flavor2||x.sabor_2||'',
          quantidade:qtd,
          total:unit*qtd
        });
      });
    });
    const vendas=[...vendasInternas,...vendasDelivery];
    const caixas=await api(`caixa_sessoes?aberto_em=gte.${ini}&aberto_em=lte.${fim}&select=*&order=aberto_em.desc&limit=50`);

    const faturamento=vendas.reduce((n,v)=>n+Number(v.total||0),0);
    const descontos=vendas.reduce((n,v)=>n+Number(v.desconto||0),0);
    const ticket=vendas.length?faturamento/vendas.length:0;

    const pgMap={}; vendas.forEach(v=>{const k=v.forma_pagamento||'Não informado';pgMap[k]??={total:0,q:0};pgMap[k].total+=Number(v.total||0);pgMap[k].q++});
    const payHtml=Object.keys(pgMap).length?Object.entries(pgMap).sort((a,b)=>b[1].total-a[1].total).map(([k,x])=>reportRow(k,money(x.total)+' · '+x.q+' venda(s)')).join(''):'<div class="small">Sem vendas.</div>';

    const orMap={}; vendas.forEach(v=>{const k=v.tipo||'outro';orMap[k]??={total:0,q:0};orMap[k].total+=Number(v.total||0);orMap[k].q++});
    const origemNome=k=>String(k).replace('balcao','Balcão').replace('mesa','Mesas').replace('delivery','Delivery');
    const origHtml=Object.keys(orMap).length?Object.entries(orMap).sort((a,b)=>b[1].total-a[1].total).map(([k,x])=>reportRow(origemNome(k),money(x.total)+' · '+x.q+' venda(s)')).join(''):'<div class="small">Sem vendas.</div>';

    const dayMap={}; vendas.forEach(v=>{const k=localDateStr(new Date(v.fechada_em));dayMap[k]??={total:0,q:0};dayMap[k].total+=Number(v.total||0);dayMap[k].q++});
    const diasHtml=Object.keys(dayMap).length?Object.entries(dayMap).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,x])=>reportRow(new Date(k+'T12:00:00').toLocaleDateString('pt-BR'),money(x.total)+' · '+x.q+' venda(s)')).join(''):'<div class="small">Sem vendas.</div>';

    const prodMap={}; itens.forEach(x=>{const k=(x.produto_nome||'Produto')+'||'+(x.tamanho||'');prodMap[k]??={nome:x.produto_nome||'Produto',tam:x.tamanho||'',q:0,total:0};prodMap[k].q+=Number(x.quantidade||0);prodMap[k].total+=Number(x.total||0)});
    const prods=Object.values(prodMap).sort((a,b)=>b.q-a.q||b.total-a.total).slice(0,10);
    const prodHtml=prods.length?prods.map((x,i)=>`<div class="item"><b>${i+1}. ${esc(x.nome)}${x.tam?' — '+esc(x.tam):''}</b><div class="small">${x.q} un. · ${money(x.total)}</div></div>`).join(''):'<div class="small">Sem itens.</div>';

    const sabMap={}; itens.forEach(x=>{[x.sabor_1,x.sabor_2].filter(Boolean).forEach(s=>sabMap[s]=(sabMap[s]||0)+Number(x.quantidade||1))});
    const sabores=Object.entries(sabMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
    const sabHtml=sabores.length?sabores.map(([s,q],i)=>`<div class="item"><b>${i+1}. ${esc(s)}</b><div class="small">${q} ocorrência(s)</div></div>`).join(''):'<div class="small">Sem sabores.</div>';

    
    window._reportVendas=vendas;
    window._reportItens=itens;
    const vendasHtml=vendas.length?vendas.slice().sort((a,b)=>new Date(b.fechada_em)-new Date(a.fechada_em)).map((v,i)=>{
      const origem=String(v.tipo||'outro').replace('balcao','Balcão').replace('mesa','Mesa').replace('delivery','Delivery');
      const hora=new Date(v.fechada_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      const qtd=itens.filter(x=>String(x.comanda_id)===String(v.id)).reduce((n,x)=>n+Number(x.quantidade||1),0);
      const pedido=v._order_no?' · Pedido '+esc(v._order_no):'';
      return `<div class="item" style="cursor:pointer" onclick="vendaDetalheHtml(window._reportVendas.find(x=>String(x.id)==='${v.id}'),window._reportItens.filter(x=>String(x.comanda_id)==='${v.id}'))"><div class="row"><div class="grow"><b>${hora} · ${origem}${pedido}</b><div class="small">${esc(v.forma_pagamento||'Não informado')} · ${qtd} item(ns)${v.cliente_nome?' · '+esc(v.cliente_nome):''}</div></div><b>${money(v.total)}</b></div><div class="small">Toque para ver os detalhes</div></div>`;
    }).join(''):'<div class="small">Sem vendas no período.</div>';

    const cxHtml=caixas.length?caixas.map(x=>`<div class="item"><b>${esc(x.operador||'Operador')} — ${String(x.status).toUpperCase()}</b><div class="small">Abertura: ${new Date(x.aberto_em).toLocaleString('pt-BR')}${x.fechado_em?' · Fechamento: '+new Date(x.fechado_em).toLocaleString('pt-BR'):''}</div><div class="small">Inicial ${money(x.valor_abertura)}${x.valor_fechamento_informado!=null?' · Informado '+money(x.valor_fechamento_informado)+' · Diferença '+money(x.diferenca):''}</div></div>`).join(''):'<div class="small">Sem caixas no período.</div>';

    const label=rg.start.toLocaleDateString('pt-BR')+(localDateStr(rg.start)!==localDateStr(rg.end)?' até '+rg.end.toLocaleDateString('pt-BR'):'');
    reports.innerHTML=`<h2>Relatórios</h2>${reportFilterBar()}
      <div class="small" style="margin-top:10px">Exibindo: ${label}</div>
      <div class="card" style="margin-top:10px"><div class="small">Resumo do período</div><div class="total">${money(faturamento)}</div>${reportRow('Vendas',vendas.length)}${reportRow('Ticket médio',money(ticket))}${reportRow('Descontos',money(descontos))}</div>
      <div class="card" style="margin-top:10px"><h3>Formas de pagamento</h3>${payHtml}</div>
      <div class="card" style="margin-top:10px"><h3>Origem das vendas</h3>${origHtml}</div>
      <div class="card" style="margin-top:10px"><h3>Vendas por dia</h3>${diasHtml}</div>
      <div class="card" style="margin-top:10px"><h3>Produtos mais vendidos</h3>${prodHtml}</div>
      <div class="card" style="margin-top:10px"><h3>Sabores mais vendidos</h3>${sabHtml}</div>
      <div class="card" style="margin-top:10px"><h3>Vendas realizadas</h3><div class="small" style="margin-bottom:8px">Toque em uma venda para consultar os itens.</div>${vendasHtml}</div>
      <div class="card" style="margin-top:10px"><h3>Histórico de caixas</h3>${cxHtml}</div>`;
  }catch(e){reports.innerHTML='<h2>Relatórios</h2>'+reportFilterBar()+'<div class="notice">Erro: '+esc(e.message)+'</div>'}
}


function cozinhaTicket(titulo,cliente,itens){
  const agora=new Date();
  const linhas=(itens||[]).map(x=>{
    let sabores='';
    if(x.sabor_2) sabores=`<div>½ ${esc(x.sabor_1)} + ½ ${esc(x.sabor_2)}</div>`;
    let obs=x.observacoes?`<div class="pt-note">Obs: ${esc(x.observacoes)}</div>`:'';
    return `<div class="pt-item"><b>${Number(x.quantidade||1)}x ${esc(x.produto_nome||'Produto')}</b>${x.tamanho?`<div>Tamanho: ${esc(x.tamanho)}</div>`:''}${sabores}${obs}</div>`;
  }).join('');
  printTicket.innerHTML=`<div class="pt-center pt-big">LA SUPREME</div><div class="pt-center"><b>COMANDA DA COZINHA</b></div><div class="pt-line"></div><div class="pt-big">${esc(titulo)}</div>${cliente?`<div>Cliente: <b>${esc(cliente)}</b></div>`:''}<div>Horário: ${agora.toLocaleString('pt-BR')}</div><div class="pt-line"></div>${linhas||'<div>Sem itens.</div>'}<div class="pt-line"></div><div class="pt-center"><b>FIM DA COMANDA</b></div>`;
  printTicket.style.display='block';
  window.print();
  setTimeout(()=>{printTicket.style.display='none'},500);
}
function imprimirMesa(){
  if(!sitems.length)return alert('Não há itens para imprimir.');
  cozinhaTicket('MESA '+esc(curT?.numero||''),curC?.cliente_nome||'',sitems);
}
function imprimirBalcao(){
  if(!bCart.length)return alert('Adicione itens antes de imprimir.');
  cozinhaTicket('BALCÃO',document.getElementById('bc')?.value.trim()||'',bCart);
}

function closeM(){modal.innerHTML='';curT=curC=null;sitems=[]}
