<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>La Supreme — Motoboy</title><link rel="stylesheet" href="tracking.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script defer src="rastreio-config.js"></script><script defer src="tracking-common.js"></script><script defer src="tracking-driver.js"></script></head><body><header>LA <span>SUPREME</span> · Motoboy</header><main><section id="driverLogin" class="card"><h1>Acesso do entregador</h1><form id="driverLoginForm"><label>E-mail<input id="driverEmail" type="email" autocomplete="username" required></label><label>Senha<input id="driverPassword" type="password" autocomplete="current-password" required></label><button id="driverLoginButton">Entrar</button></form></section><section id="driverApp" hidden><h1 id="driverName">Minhas entregas</h1><div class="actions"><button onclick="driverShift(true)">Iniciar turno</button><button class="secondary" onclick="driverShift(false)">Encerrar turno</button><button class="secondary" onclick="driverLogout()">Sair</button></div><p id="driverShiftStatus" class="muted"></p><div class="card"><label><input type="checkbox" id="gpsConsent">Autorizo compartilhar minha localização durante a entrega ativa.</label><p class="muted">Compartilhamento somente após tocar em Ativar GPS. Mantenha esta página aberta e a tela ligada; ao sair da página o envio é pausado. Uma entrega em trajeto por vez.</p><div class="actions"><button onclick="driverStartGPS()">Ativar GPS</button><button class="secondary" onclick="driverStopGPS(true)">Pausar GPS</button></div><div id="driverGpsStatus" class="notice" role="status">GPS pausado</div></div><div class="actions"><button class="secondary" onclick="driverLoad()">Atualizar entregas</button></div><div id="trackMap" aria-label="Minha localização durante a entrega" hidden></div><div id="driverJobs"></div></section><div id="driverError" class="notice" role="alert" hidden></div></main></body></html>
