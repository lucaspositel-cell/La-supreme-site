function summary(){let qty=0,total=0;cart.forEach(x=>{qty+=x.qty;total+=x.qty*x.value});$('total').textContent=qty+' '+(qty===1?'item':'itens')+' · '+money(total);$('finish').disabled=!qty;return total}
function render(){const grid=$('grid');grid.replaceChildren();$('results').textContent=active==='all'?'Cardápio completo':categories[active];const q=norm($('search').value.trim());catalog.forEach((x,i)=>{if((active!=='all'&&active!==x.section)||!norm(x.name+' '+x.desc).includes(q))return;const card=node('article','',grid);const art=node('span',icons[x.section]||'🍕',card);art.className='product-icon '+(x.section==='cat-bebidas'?'drink':x.section==='cat-pizzas-doces'?'sweet':'');art.setAttribute('aria-hidden','true');const illustration=pizzaArt(x.section);if(illustration)art.innerHTML=illustration;const kind=node('span',productTypes[x.section]||(x.isPizza?'Pizza':'Item do cardápio'),card);kind.className='product-kind '+(x.section==='cat-pizzas-doces'?'sweet':x.section==='cat-bebidas'?'drink':'');node('strong',x.name,card);node('p',x.desc,card);const actions=node('div','',card);actions.className='actions';for(const [label,v] of (x.isPizza?[['Broto',x.broto],['Grande',x.grande]]:[['',x.price]])){if(!Number.isFinite(v)||v<=0)continue;button(actions,(label||'Adicionar')+' · '+money(Math.round(v*100)),()=>add(i,label,v))}if(x.isPizza){const half=button(actions,'½ Meio a meio',()=>openHalf(i),'secondary');half.classList.add('half-action')}});if(!grid.childElementCount)node('p','Nenhum item encontrado nesta categoria.',grid);}
const pizzaKeys=new Set(Object.keys(productTypes).filter(key=>productTypes[key].startsWith('Pizza')));
const mainButtons=new Map(), groupButtons=new Map();
function selectCategory(key){
 active=key;
 for(const [id,b] of mainButtons)b.setAttribute('aria-pressed',id===key);
 for(const [id,b] of groupButtons)b.setAttribute('aria-pressed',id===key);
 pizzaMenu.classList.toggle('current',pizzaKeys.has(key));
 if(!pizzaKeys.has(key))showPizzaGroups(false);
 render();
}
function showPizzaGroups(open){
 $('pizzaGroups').hidden=!open;
 pizzaMenu.setAttribute('aria-expanded',open);
 pizzaMenu.textContent=open?'🍕 Pizzas ▴':'🍕 Pizzas ▾';
}
mainButtons.set('all',button($('cats'),'Todos',()=>selectCategory('all'),'secondary'));
const pizzaMenu=button($('cats'),'🍕 Pizzas ▾',()=>showPizzaGroups($('pizzaGroups').hidden),'secondary');
pizzaMenu.id='pizzaMenu';pizzaMenu.setAttribute('aria-controls','pizzaGroups');showPizzaGroups(false);
for(const [key,label] of Object.entries(categories)){
 if(key==='all')continue;
 const isPizza=pizzaKeys.has(key), sweet=key==='cat-pizzas-doces';
 const b=button($(isPizza?'pizzaGroups':'cats'),sweet?label:(isPizza?'':(icons[key]||'')+' ')+label,()=>selectCategory(key),'secondary');
 if(isPizza){b.classList.add('sweet-category');b.insertAdjacentHTML('afterbegin',pizzaArt(key))}
 (isPizza?groupButtons:mainButtons).set(key,b);
 b.setAttribute('aria-pressed','false');
}
mainButtons.get('all').setAttribute('aria-pressed','true');
function review(){const items=$('items');items.replaceChildren();for(const [key,x] of cart){const r=node('div','',items);r.className='row';node('span',x.qty+' × '+x.name+(x.size?' · '+x.size:'')+' — '+money(x.value*x.qty),r);const b=button(r,'−',()=>{if(--x.qty===0)cart.delete(key);review()},'secondary');b.setAttribute('aria-label','Remover uma unidade de '+x.name)}node('p',cart.size?'Total: '+money(summary()):'Sua sacola está vazia.',items);summary()}
$('search').oninput=render;$('review').onclick=()=>{review();$('bag').showModal()};$('back').onclick=()=>$('bag').close();$('finish').onclick=()=>{if(!cart.size)return;$('items').replaceChildren();node('p','Pedido simulado. Nenhum pedido foi enviado e nenhuma cobrança foi feita.',$('items'));$('finish').disabled=true;cart.clear();$('feedback').textContent='';$('search').value='';selectCategory('all');window.scrollTo(0,0);summary()};render();summary();
</script></html>
