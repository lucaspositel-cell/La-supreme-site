const icons={'cat-bebidas':'🥤','cat-calzones':'🥟','cat-crostinis':'🥖','cat-pizza-rolls':'🌀'};
function node(tag,value,parent){const el=document.createElement(tag);el.textContent=value;parent.append(el);return el}
function button(parent,label,action,cls){const b=node('button',label,parent);b.type='button';b.onclick=action;if(cls)b.className=cls;return b}
function putInCart(key,name,size,value,i,j,crust,obs){if(sending||requestId)return;const item=cart.get(key)||{name,size,value,i,j,crust,obs,qty:0};item.qty++;cart.set(key,item);$('feedback').textContent=item.name+' na sacola';summary()}
const crustPrices={"Catupiry": [800, 1200], "Cheddar": [800, 1200], "Pistache": [1000, 1500], "Avelã": [1000, 1500], "Chocolate ao leite": [800, 1200]};
let customItem=null;
function crustCost(x,size,crust){
 if(!crust)return 0;
 if(/supreme/i.test(x.name)&&(sweetPizza(x)||crust==='Catupiry'||crust==='Cheddar'))return 0;
 return crustPrices[crust][size==='Broto'?0:1];
}
function openCustom(name,size,base,i,j=null){
 if(sending||requestId)return;
 customItem={name,size,base,i,j};
 const x=catalog[i], select=$('customCrust');
 $('customTitle').textContent=name;
 $('customSize').textContent=size;
 $('customObs').value='';
 $('customHint').textContent='';
 $('customCrustField').hidden=!x.isPizza;
 select.replaceChildren(new Option('Sem borda',''));
 if(x.isPizza)for(const crust of Object.keys(crustPrices)){
   const cost=crustCost(x,size,crust);
   select.add(new Option(crust+(cost?' · + '+money(cost):' · inclusa'),crust));
 }
 refreshCustom();
 $('custom').showModal();
}
function refreshCustom(){
 const x=customItem;
 if(x)$('customAdd').textContent='Adicionar · '+money(x.base+crustCost(catalog[x.i],x.size,$('customCrust').value));
}
$('customCrust').onchange=refreshCustom;
$('customBack').onclick=()=>$('custom').close();
$('customAdd').onclick=()=>{
 const x=customItem;
 if(!x||sending||requestId)return;
 const obs=$('customObs').value.trim().replace(/\s+/g,' ');
 if(/[<>&"'\x00-\x1f\x7f]/.test(obs)){
   $('customHint').textContent='Use texto simples na observação, sem aspas, <, > ou &.';
   return;
 }
 const crust=$('customCrust').value;
 const key=JSON.stringify([x.i,x.j,x.size,crust,obs]);
 putInCart(key,x.name,x.size,x.base+crustCost(catalog[x.i],x.size,crust),x.i,x.j,crust,obs);
 $('custom').close();
};
function add(i,size,value){openCustom(catalog[i].name,size,Math.round(value*100),i)}

let halfFirst=null;
const halfPrice=(x,size)=>Math.round(Number(size==='Broto'?x.broto:x.grande)*100);
function halfTotal(a,b){return Math.round((a+b)/2)}
function sweetPizza(x){return x.section==='cat-pizzas-doces'}
function openHalf(i){halfFirst=i;$('firstFlavor').textContent='Primeira metade: '+catalog[i].name;$('halfSize').value='Grande';updateHalfOptions();$('half').showModal()}
function updateHalfOptions(){
 const size=$('halfSize').value, sel=$('secondFlavor'), previous=sel.value;
 sel.replaceChildren(new Option('Escolha o segundo sabor',''));
 catalog.forEach((x,i)=>{if(i!==halfFirst&&x.isPizza&&sweetPizza(x)===sweetPizza(catalog[halfFirst])&&halfPrice(x,size)>0)sel.add(new Option(x.name+' · '+money(halfPrice(x,size)),i))});
 if([...sel.options].some(o=>o.value===previous))sel.value=previous;
 refreshHalf();
}
function refreshHalf(){
 const id=$('secondFlavor').value,size=$('halfSize').value;
 const a=halfPrice(catalog[halfFirst],size), b=id===''?0:halfPrice(catalog[Number(id)],size);
 const valid=a>0&&b>0;
 $('halfAdd').disabled=!valid;
 $('halfTotal').textContent=valid?'Total da pizza: '+money(halfTotal(a,b)):'Escolha as duas metades para ver o total.';
 return valid?halfTotal(a,b):null;
}
$('halfSize').onchange=updateHalfOptions;$('secondFlavor').onchange=refreshHalf;
$('halfBack').onclick=()=>$('half').close();
$('halfAdd').onclick=()=>{const price=refreshHalf();if(price===null)return;const second=Number($('secondFlavor').value),size=$('halfSize').value;$('half').close();openCustom('Meio a meio: '+catalog[halfFirst].name+' + '+catalog[second].name,size,price,halfFirst,second)};
function summary(){let qty=0,total=0;cart.forEach(x=>{qty+=x.qty;total+=x.qty*x.value});$('total').textContent=qty+' '+(qty===1?'item':'itens')+' · '+money(total);$('finish').disabled=!qty;return total}
function render(){const grid=$('grid');grid.replaceChildren();$('results').textContent=active==='all'?'Cardápio completo':categories[active];const q=norm($('search').value.trim());catalog.forEach((x,i)=>{if((active!=='all'&&active!==x.section)||!norm(x.name+' '+x.desc).includes(q))return;const card=node('article','',grid);const art=node('span',icons[x.section]||'🍕',card);art.className='product-icon '+(x.section==='cat-bebidas'?'drink':x.section==='cat-pizzas-doces'?'sweet':'');art.setAttribute('aria-hidden','true');const illustration=pizzaArt(x.section);if(illustration)art.innerHTML=illustration;if(x.section==='cat-bebidas'&&drinkPhotos[x.name]){
const img=document.createElement('img');img.alt='';img.decoding='async';
img.addEventListener('load',()=>{art.replaceChildren(img);art.classList.add('has-photo')},{once:true});
img.src=drinkPhotos[x.name];
}const kind=node('span',productTypes[x.section]||(x.isPizza?'Pizza':'Item do cardápio'),card);kind.className='product-kind '+(x.section==='cat-pizzas-doces'?'sweet':x.section==='cat-bebidas'?'drink':'');node('strong',x.name,card);node('p',x.desc,card);const actions=node('div','',card);actions.className='actions';for(const [label,v] of (x.isPizza?[['Broto',x.broto],['Grande',x.grande]]:[['',x.price]])){if(!Number.isFinite(v)||v<=0)continue;button(actions,(label||'Adicionar')+' · '+money(Math.round(v*100)),()=>add(i,label,v))}if(x.isPizza){const half=button(actions,'½ Meio a meio',()=>openHalf(i),'secondary');half.classList.add('half-action')}});if(!grid.childElementCount)node('p','Nenhum item encontrado nesta categoria.',grid);}
const pizzaKeys=new Set(Object.keys(productTypes).filter(key=>productTypes[key].startsWith('Pizza')));
const mainButtons=new Map(), groupButtons=new Map();
function selectCategory(key){
 active=key;
 for(const [id,b] of mainButtons)b.setAttribute('aria-pressed',id===key);
 for(const [id,b] of groupButtons)b.setAttribute('aria-pressed',id===key);
 pizzaMenu.classList.toggle('current',pizzaKeys.has(key));
 if(!pizzaKeys.has(key))showPizzaGroups(false);
 render();
}
function showPizzaGroups(open){

}
mainButtons.set('all',button($('cats'),'Todos',()=>selectCategory('all'),'secondary'));
const pizzaMenu=button($('cats'),'🍕 Pizzas ▾',()=>showPizzaGroups($('pizzaGroups').hidden),'secondary');
pizzaMenu.id='pizzaMenu';pizzaMenu.setAttribute('aria-controls','pizzaGroups');showPizzaGroups(false);
for(const [key,label] of Object.entries(categories)){
 if(key==='all')continue;
 const isPizza=pizzaKeys.has(key), sweet=key==='cat-pizzas-doces';
 const b=button($(isPizza?'pizzaGroups':'cats'),sweet?label:(isPizza?'':(icons[key]||'')+' ')+label,()=>selectCategory(key),'secondary');
 if(isPizza){b.classList.add('sweet-category');b.insertAdjacentHTML('afterbegin',pizzaArt(key))}

}
mainButtons.get('all').setAttribute('aria-pressed','true');
function review(){$('customerField').hidden=!cart.size;if(!cart.size)$('customerName').value='';const items=$('items');items.replaceChildren();for(const [key,x] of cart){const r=node('div','',items);r.className='row';node('span',x.qty+' × '+x.name+(x.size?' · '+x.size:'')+(x.crust?' · Borda: '+x.crust:'')+(x.obs?' · Obs.: '+x.obs:'')+' — '+money(x.value*x.qty),r);const b=button(r,'−',()=>{if(sending||requestId)return;if(--x.qty===0)cart.delete(key);review()},'secondary');b.setAttribute('aria-label','Remover uma unidade de '+x.name)}node('p',cart.size?'Total: '+money(summary()):'Sua sacola está vazia.',items);summary()}
$('search').oninput=render;$('review').onclick=()=>{review();$('bag').showModal()};$('back').onclick=()=>$('bag').close();let session=null, requestId=null,sending=false;
try{session=JSON.parse(localStorage.getItem('ls_totem_session')||'null')}catch{}
function saveSession(next){session=next;try{localStorage.setItem('ls_totem_session',JSON.stringify(next))}catch{}}
async function call(path,body,token){
 const r=await fetch(SUPABASE_URL+path,{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)});
 const d=await r.json().catch(()=>null);
 if(!r.ok){const e=Error(d?.message||d?.msg||'Falha de comunicação.');e.status=r.status;throw e}
 return d;
}
async function token(){
 if(!session)throw Error('Ative o tablet com a conta da equipe.');
 if(session.expires_at*1000<Date.now()+30000){
   saveSession(await call('/auth/v1/token?grant_type=refresh_token',{refresh_token:session.refresh_token}));
 }
 return session.access_token;
}
$('deviceBack').onclick=()=>{$('deviceSetup').hidden=true;$('bag').showModal()};
$('deviceForm').onsubmit=async e=>{
 e.preventDefault();$('deviceLogin').disabled=true;
 try {
   const next=await call('/auth/v1/token?grant_type=password',{email:$('deviceEmail').value.trim(),password:$('devicePassword').value});
   if(await call('/rest/v1/rpc/ls_totem_authorized',{},next.access_token)!==true)throw Error('Conta ainda não autorizada para o totem.');
   saveSession(next);e.target.reset();$('deviceStatus').textContent='';$('deviceSetup').hidden=true;$('bag').showModal();
 }catch(err){$('deviceStatus').textContent=err.message}finally{$('deviceLogin').disabled=false}
};
// RawBT recebe bytes ESC/POS. Texto ASCII evita divergencias de tabela de acentos.
function receiptLink(code, lines, customer){
 const width=32;
 const ascii=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^ -~]/g,' ');
 const wrap=s=>ascii(s).match(/.{1,32}(?: |$)|.{1,32}/g)?.map(x=>x.trimEnd()).join('\n')||'';
 const amount=c=>'R$ '+(c/100).toFixed(2).replace('.',',');
 const sale=lines.reduce((sum,x)=>sum+x.value*x.qty,0);
 const sep='-'.repeat(width)+'\n';
 const body=lines.map(x=>wrap(x.qty+' x '+x.name+(x.size?' - '+x.size:''))+
      (x.crust?'\n'+wrap('Borda: '+x.crust):'')+(x.obs?'\n'+wrap('Obs.: '+x.obs):'')+'\n  '+amount(x.value*x.qty)+'\n').join('\n');
 const bytes='\x1b@\x1ba\x01\x1bE\x01LA SUPREME\nVIA DO CLIENTE\n'+'SENHA '+code+'\n'+(customer?wrap('Nome: '+customer)+'\n':'')+
      '\n\x1bE\x00\x1ba\x00'+sep+body+sep+'TOTAL: '+amount(sale)+
      '\nPagamento no caixa\nNao comprova pagamento\n\n\n\n';
 return 'rawbt:base64,'+btoa(bytes);
}
$('customerName').oninput=()=>{$('customerName').setCustomValidity('')};
let receiptUntil=0, receiptTimer;
function dismissReceipt(){
 if(!receiptUntil)return;
 receiptUntil=0;
 clearTimeout(receiptTimer);
 $('items').replaceChildren();
 if($('bag').open)$('bag').close();
}
$('bag').addEventListener('close',()=>{
 if(!$('bag').open)dismissReceipt();
});
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden&&receiptUntil&&Date.now()>=receiptUntil)dismissReceipt();
});
$('finish').onclick=async()=>{
 if(sending||!cart.size)return;
 if(!session){$('bag').close();$('deviceSetup').hidden=false;$('deviceSetup').scrollIntoView();return}
 const customer=$('customerName').value.trim().replace(/ +/g,' ');
 if(/[<>&"\x00-\x1f\x7f]/.test(customer)||customer.includes(String.fromCharCode(39))){
   $('customerName').setCustomValidity('Digite o nome sem aspas ou símbolos como <, > e &.');
   $('customerName').reportValidity();
   return;
 }
 $('customerName').disabled=true;
 sending=true;$('finish').disabled=true;$('finish').textContent='Enviando…';
 try{
   const lines=[...cart.values()].map(x=>({...x}));
   const access=await token();requestId??=crypto.randomUUID();
   const code=await call('/rest/v1/rpc/ls_totem_order_v4',{p_request:requestId,p_customer:customer,p_items:lines.map(({i,j,size,qty,crust,obs})=>({i,j,size,qty,crust,obs}))},access);
   if(typeof code!=='string'||!/^LS[0-9]{5,}T$/.test(code))throw Error('O envio não foi confirmado.');
   const pickup=code;
   cart.clear();requestId=null;$('customerName').value='';$('customerField').hidden=true;
   $('items').replaceChildren();
   node('h3','Senha '+pickup,$('items')).className='pickup-code';
   if(customer)node('p',customer,$('items'));
   node('p','Mostre esta senha e pague no caixa.',$('items'));
   $('feedback').textContent='';$('search').value='';selectCategory('all');
   receiptUntil=Date.now()+10000;
   receiptTimer=setTimeout(dismissReceipt,10000);
   try{
     const print=node('a','Imprimir via do cliente',$('items'));
     print.addEventListener('click',event=>{
       if(!receiptUntil||Date.now()>=receiptUntil){
         event.preventDefault();
         dismissReceipt();
       }
     });
     print.href=receiptLink(pickup,lines,customer);
     node('p','Se a via não sair, toque em Imprimir via do cliente.',$('items'));
     print.click();
   }catch(err){
     node('p','Pedido recebido. Não foi possível abrir a impressão.',$('items'));
   }
 }catch(err){
   if(err.status===401)saveSession(null);
   if(err.status===400||err.status===403)requestId=null;
   node('p','Não foi possível confirmar. '+err.message+' Toque em Enviar novamente.',$('items')).setAttribute('role','alert');
 }finally{sending=false;$('customerName').disabled=!!requestId;$('finish').textContent='Enviar pedido ao caixa';summary()}
};
// Keep Android Back inside the installed kiosk after the first interaction.
const standalone=matchMedia('(display-mode: standalone)').matches ||
                 matchMedia('(display-mode: fullscreen)').matches;
if(standalone){
 const armBack=()=>{
   if(!history.state?.lsTotemBack)
     history.pushState({...history.state,lsTotemBack:true},'',location.href);
 };
 document.addEventListener('click',event=>{
   if(event.isTrusted)armBack();
 },true);
 window.addEventListener('popstate',()=>{
   if($('custom').open)$('custom').close();
   else if($('half').open)$('half').close();
   else if($('bag').open){
     if(receiptUntil)dismissReceipt();
     else $('bag').close();
   }
   armBack();
 });
}
render();summary();
</script></html>
